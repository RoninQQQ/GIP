<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <rect width="800" height="500" fill="url(#gridPattern)" />

  <!-- Ambient Glow Circles -->
  <circle cx="400" cy="220" r="180" fill="#3b82f6" opacity="0.12" filter="blur(60px)" />
  <circle cx="680" cy="100" r="120" fill="#6366f1" opacity="0.08" filter="blur(50px)" />
  <circle cx="120" cy="400" r="140" fill="#2563eb" opacity="0.08" filter="blur(50px)" />

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="752" height="452" rx="28" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <rect x="36" y="36" width="728" height="428" rx="20" fill="none" stroke="#334155" stroke-dasharray="6 6" stroke-opacity="0.6" stroke-width="1.2" />

  <!-- Center Card Container -->
  <rect x="120" y="80" width="560" height="340" rx="24" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5" />

  <!-- Top Accent Bar -->
  <rect x="120" y="80" width="560" height="4" fill="url(#accentGrad)" />

  <!-- Hardware Chip Icon Symbol -->
  <g transform="translate(400, 150)">
    <circle cx="0" cy="0" r="38" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <!-- Chip Icon Core -->
    <rect x="-16" y="-16" width="32" height="32" rx="6" fill="#2563eb" />
    <rect x="-10" y="-10" width="20" height="20" rx="3" fill="#1e1e2f" />
    <!-- Chip Pins -->
    <path d="M-8 -22 L-8 -16 M0 -22 L0 -16 M8 -22 L8 -16 M-8 16 L-8 22 M0 16 L0 22 M8 16 L8 22 M-22 -8 L-16 -8 M-22 0 L-16 0 M-22 8 L-16 8 M16 -8 L22 -8 M16 0 L22 0 M16 8 L22 8" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Status Pill Badge -->
  <g transform="translate(400, 215)">
    <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <circle cx="-115" cy="0" r="4" fill="#38bdf8" />
    <text x="-95" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">
      PROD ENVIRONMENT TEST
    </text>
  </g>

  <!-- Main Headline Title -->
  <text x="400" y="275" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="0.5">
    TEST İLANI / ÖRNEK ÜRÜN GÖRSELİ
  </text>

  <!-- Subtitle Text -->
  <text x="400" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">
    Gerçek Çalışma Ortamı Test Verisi
  </text>

  <!-- Footer Verification Badge -->
  <g transform="translate(400, 365)">
    <rect x="-180" y="-16" width="360" height="32" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <path d="M-155 0 L-150 5 L-140 -5" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="-125" y="4.5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">
      DonanımPazar Sepet &amp; Satış Akışı Testi
    </text>
  </g>

  <!-- Corner Highlights -->
  <circle cx="48" cy="48" r="3" fill="#3b82f6" opacity="0.6" />
  <circle cx="752" cy="48" r="3" fill="#3b82f6" opacity="0.6" />
  <circle cx="48" cy="452" r="3" fill="#3b82f6" opacity="0.6" />
  <circle cx="752" cy="452" r="3" fill="#3b82f6" opacity="0.6" />
</svg>
